name: MathPress build and Pages
on:
  push:
    branches: [main, 'fix/pages-build', 'feature/v0.5.0-editing-engine']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify production entry
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          ! grep -q 'main.tsx' dist/index.html
          ! grep -q '__BUILD_ID__' dist/sw.js
      - name: Install Chromium and PDF inspection tools
        run: |
          npx playwright-core install --with-deps chromium
          sudo apt-get install -y poppler-utils
      - name: Test editing and PDF publishing
        run: |
          npm run preview -- --host 127.0.0.1 --port 4174 --strictPort &
          preview=$!
          trap 'kill "$preview" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          MATHPRESS_QA_URL=http://127.0.0.1:4174/ npm run test:e2e
      - name: Test offline upgrade and IndexedDB preservation
        run: |
          baseline=$(mktemp -d)
          git fetch --no-tags --depth=1 origin f8cc43cc3c39042d1d1388310efcb9348a87a582
          git archive FETCH_HEAD | tar -x -C "$baseline"
          npm --prefix "$baseline" ci
          npm --prefix "$baseline" run build
          MATHPRESS_BASELINE_DIST="$baseline/dist" node pwaUpgrade.e2e.cjs
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
