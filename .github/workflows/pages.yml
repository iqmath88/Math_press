name: MathPress build and Pages
on:
  push:
    branches: [main, 'fix/pages-build', 'feature/v0.5.0-editing-engine', 'feature/v0.6.0-math-authoring-studio', 'feature/v0.6.0-educational-authoring', 'feature/v0.6.0-professional-studio', 'release/v0.6.0-rc.1', 'release/v0.6.0', 'feature/v0.6.1-smart-math-input', 'feature/v0.7.0-creative-studio']
  pull_request:
    branches: [main, 'feature/v0.6.0-math-authoring-studio', 'feature/v0.6.0-educational-authoring', 'feature/v0.6.0-professional-studio', 'feature/v0.6.1-smart-math-input']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify production entry
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          ! grep -q 'main.tsx' dist/index.html
          ! grep -q '__BUILD_ID__' dist/sw.js
      - name: Install browsers and PDF inspection tools
        run: |
          npx playwright-core install --with-deps chromium webkit
          sudo apt-get install -y poppler-utils
      - name: Test editing and PDF publishing
        env:
          MATHPRESS_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          npm run preview -- --host 127.0.0.1 --port 4174 --strictPort &
          preview=$!
          trap 'kill "$preview" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          mkdir -p "$RUNNER_TEMP/print-compatibility"
          export MATHPRESS_QA_OUTPUT="$RUNNER_TEMP/print-compatibility"
          trap 'echo "::error::Failed command: $BASH_COMMAND"' ERR
          if [ "$MATHPRESS_BRANCH" = "feature/v0.6.0-math-authoring-studio" ] || [ "$MATHPRESS_BRANCH" = "feature/v0.6.0-educational-authoring" ] || [ "$MATHPRESS_BRANCH" = "feature/v0.6.0-professional-studio" ] || [[ "$MATHPRESS_BRANCH" == main || "$MATHPRESS_BRANCH" == release/v0.6.0 || "$MATHPRESS_BRANCH" == release/v0.6.0-rc.1 || "$MATHPRESS_BRANCH" == feature/v0.6.1-smart-math-input || "$MATHPRESS_BRANCH" == feature/v0.7.0-creative-studio ]]; then
            node stability.e2e.cjs webkit history
          fi
          if [[ "$MATHPRESS_BRANCH" == feature/v0.7.0-creative-studio ]]; then
            MATHPRESS_CREATIVE_VIDEO=1 node creative.e2e.cjs chromium
            node creative.e2e.cjs webkit
          fi
          npm run test:e2e
          node printCompatibility.e2e.cjs chromium
          node printCompatibility.e2e.cjs webkit
          node stability.e2e.cjs chromium
          node stability.e2e.cjs webkit
          node authoring.e2e.cjs chromium
          node authoring.e2e.cjs webkit
          node educational.e2e.cjs chromium
          node educational.e2e.cjs webkit
          if [ "$MATHPRESS_BRANCH" = "feature/v0.6.0-professional-studio" ] || [[ "$MATHPRESS_BRANCH" == main || "$MATHPRESS_BRANCH" == release/v0.6.0 || "$MATHPRESS_BRANCH" == release/v0.6.0-rc.1 || "$MATHPRESS_BRANCH" == feature/v0.6.1-smart-math-input || "$MATHPRESS_BRANCH" == feature/v0.7.0-creative-studio ]]; then
            node studio.e2e.cjs chromium
            node studio.e2e.cjs webkit
            if [[ "$MATHPRESS_BRANCH" == main || "$MATHPRESS_BRANCH" == release/v0.6.0 || "$MATHPRESS_BRANCH" == release/v0.6.0-rc.1 || "$MATHPRESS_BRANCH" == feature/v0.6.1-smart-math-input || "$MATHPRESS_BRANCH" == feature/v0.7.0-creative-studio ]]; then node rc.e2e.cjs; fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: print-compatibility
          path: ${{ runner.temp }}/print-compatibility/
          if-no-files-found: ignore
      - name: Test offline upgrade and IndexedDB preservation
        env:
          MATHPRESS_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          baseline=$(mktemp -d)
          git fetch --no-tags --depth=1 origin f8cc43cc3c39042d1d1388310efcb9348a87a582
          git archive FETCH_HEAD | tar -x -C "$baseline"
          npm --prefix "$baseline" ci
          npm --prefix "$baseline" run build
          MATHPRESS_BASELINE_DIST="$baseline/dist" node pwaUpgrade.e2e.cjs
          previous=$(mktemp -d)
          git fetch --no-tags --depth=1 origin 669bc427973869a2b349ee8b47a77941180aa334
          git archive FETCH_HEAD | tar -x -C "$previous"
          npm --prefix "$previous" ci
          npm --prefix "$previous" run build
          MATHPRESS_BASELINE_VERSION=0.5.0 MATHPRESS_BASELINE_DIST="$previous/dist" node pwaUpgrade.e2e.cjs
          stable=$(mktemp -d)
          git fetch --no-tags --depth=1 origin 4cb4c4cab38bab2faf8ba3111032e0a97da0a3d6
          git archive FETCH_HEAD | tar -x -C "$stable"
          npm --prefix "$stable" ci
          npm --prefix "$stable" run build
          MATHPRESS_BASELINE_VERSION=0.5.1 MATHPRESS_BASELINE_DIST="$stable/dist" node pwaUpgrade.e2e.cjs
          if [ "$MATHPRESS_BRANCH" = "feature/v0.6.0-educational-authoring" ] || [ "$MATHPRESS_BRANCH" = "feature/v0.6.0-professional-studio" ] || [[ "$MATHPRESS_BRANCH" == main || "$MATHPRESS_BRANCH" == release/v0.6.0 || "$MATHPRESS_BRANCH" == release/v0.6.0-rc.1 || "$MATHPRESS_BRANCH" == feature/v0.6.1-smart-math-input || "$MATHPRESS_BRANCH" == feature/v0.7.0-creative-studio ]]; then
            alpha=$(mktemp -d)
            git fetch --no-tags --depth=1 origin 2588ba3f71dbb5fe7bf20201912843949d51f238
            git archive FETCH_HEAD | tar -x -C "$alpha"
            npm --prefix "$alpha" ci
            npm --prefix "$alpha" run build
            MATHPRESS_BASELINE_VERSION=0.6.0-alpha.1 MATHPRESS_BASELINE_DIST="$alpha/dist" node pwaUpgrade.e2e.cjs
          fi
          if [ "$MATHPRESS_BRANCH" = "feature/v0.6.0-professional-studio" ] || [[ "$MATHPRESS_BRANCH" == main || "$MATHPRESS_BRANCH" == release/v0.6.0 || "$MATHPRESS_BRANCH" == release/v0.6.0-rc.1 || "$MATHPRESS_BRANCH" == feature/v0.6.1-smart-math-input || "$MATHPRESS_BRANCH" == feature/v0.7.0-creative-studio ]]; then
            previous_alpha=$(mktemp -d)
            git fetch --no-tags --depth=1 origin 8174bcc67cf859e322f2a07880ab815643dcaba4
            git archive FETCH_HEAD | tar -x -C "$previous_alpha"
            npm --prefix "$previous_alpha" ci
            npm --prefix "$previous_alpha" run build
            MATHPRESS_BASELINE_VERSION=0.6.0-alpha.2 MATHPRESS_BASELINE_DIST="$previous_alpha/dist" node pwaUpgrade.e2e.cjs
          fi
          if [[ "$MATHPRESS_BRANCH" == main || "$MATHPRESS_BRANCH" == release/v0.6.0 || "$MATHPRESS_BRANCH" == release/v0.6.0-rc.1 || "$MATHPRESS_BRANCH" == feature/v0.6.1-smart-math-input || "$MATHPRESS_BRANCH" == feature/v0.7.0-creative-studio ]]; then
            beta=$(mktemp -d)
            git fetch --no-tags --depth=1 origin 3f7a24133120dfd959d31379cf3c817435362b80
            git archive FETCH_HEAD | tar -x -C "$beta"
            npm --prefix "$beta" ci
            npm --prefix "$beta" run build
            MATHPRESS_BASELINE_VERSION=0.6.0-beta.1 MATHPRESS_BASELINE_DIST="$beta/dist" node pwaUpgrade.e2e.cjs
          fi
          if [[ "$MATHPRESS_BRANCH" == feature/v0.6.1-smart-math-input ]]; then
            stable=$(mktemp -d)
            git fetch --no-tags --depth=1 origin 9f978463d9a4b7cf2d76f848bc7ee6ca4313c872
            git archive FETCH_HEAD | tar -x -C "$stable"
            npm --prefix "$stable" ci
            npm --prefix "$stable" run build
            MATHPRESS_BASELINE_VERSION=0.6.0 MATHPRESS_BASELINE_DIST="$stable/dist" node pwaUpgrade.e2e.cjs
          fi
      - uses: actions/upload-artifact@v4
        if: (github.head_ref || github.ref_name) == 'feature/v0.6.0-educational-authoring' || (github.head_ref || github.ref_name) == 'feature/v0.6.0-professional-studio' || (github.head_ref || github.ref_name) == 'release/v0.6.0-rc.1' || (github.head_ref || github.ref_name) == 'feature/v0.6.1-smart-math-input' || (github.head_ref || github.ref_name) == 'feature/v0.7.0-creative-studio'
        with:
          name: preview-build
          path: dist
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  smart-math:
    if: (github.head_ref || github.ref_name) == 'feature/v0.6.1-smart-math-input' || (github.head_ref || github.ref_name) == 'feature/v0.7.0-creative-studio'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        session: [first, second]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright-core install --with-deps ${{ matrix.engine }}
      - name: Repeated editing tests
        env:
          ENGINE: ${{ matrix.engine }}
          MATHPRESS_QA_OUTPUT: ${{ runner.temp }}/smart-math
          MATHPRESS_VIDEO: ${{ matrix.engine == 'chromium' && matrix.session == 'first' && '1' || '0' }}
        run: |
          npm run preview -- --host 127.0.0.1 --port 4174 --strictPort &
          preview=$!
          trap 'kill "$preview" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          mkdir -p "$MATHPRESS_QA_OUTPUT"
          node smart-math.e2e.cjs "$ENGINE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-math-${{ matrix.engine }}-${{ matrix.session }}
          path: ${{ runner.temp }}/smart-math
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
